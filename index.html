<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estimateur de résistance de filets et de vis</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><h1>Estimateur de résistance de filets et de vis</h1><div class="card top"><label>Unités</label><div class="segmented" data-target="unitSystem"><button type="button" class="toggle-option" data-value="metric">Métrique</button><button type="button" class="toggle-option" data-value="imperial">Impérial</button></div><select id="unitSystem" hidden><option value="metric">Métrique</option><option value="imperial">Impérial</option></select></div><div class="card"><h2>Paramètres de la plaque</h2><div class="grid3"><div><label>Matériau</label><select id="material"></select></div><div><label id="thicknessLabel">Épaisseur (mm)</label><input id="thickness" value="4.7625" type="number"></div><div><label>Facteur de sécurité</label><input id="sf" value="1" type="number"></div></div><div id="matStrength" hidden></div></div><div class="comparison-grid"><div class="scenario-column" id="scenario1Column"><div class="card scenario-card" id="scenario1Card"><h2>Scénario 1</h2><div class="compact-row"><div class="field-inline"><label>Type de filetage</label><div class="segmented" data-target="type1"><button type="button" class="toggle-option" data-value="Grossier">Grossier</button><button type="button" class="toggle-option" data-value="Fin">Fin</button></div><select id="type1" hidden></select></div><div class="field-inline"><label>Taille</label><select id="size1"></select></div><div class="field-inline"><label>Classe</label><select id="class1" hidden></select></div></div><label>Quantité</label><div class="quantity-control"><input id="qty1Manual" class="quantity-value" value="4" type="number" min="1" step="1"><input id="qty1" value="4" type="range" min="1" max="10" step="1"></div></div><div class="card result-panel" id="scenario1Results"></div></div><div class="scenario-column" id="scenario2Column"><div class="card scenario-card" id="scenario2Card"><h2>Scénario 2</h2><div class="compact-row"><div class="field-inline"><label>Type de filetage</label><div class="segmented" data-target="type2"><button type="button" class="toggle-option" data-value="Grossier">Grossier</button><button type="button" class="toggle-option" data-value="Fin">Fin</button></div><select id="type2" hidden></select></div><div class="field-inline"><label>Taille</label><select id="size2"></select></div><div class="field-inline"><label>Classe</label><select id="class2" hidden></select></div></div><label>Quantité</label><div class="quantity-control"><input id="qty2Manual" class="quantity-value" value="2" type="number" min="1" step="1"><input id="qty2" value="2" type="range" min="1" max="10" step="1"></div></div><div class="card result-panel" id="scenario2Results"></div></div></div></div><script src="script.js"></script></body></html>
